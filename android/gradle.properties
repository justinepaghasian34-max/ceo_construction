# Low-RAM (8GB) settings: leave headroom for Dart kernel_snapshot.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=384m -XX:ReservedCodeCacheSize=128m -Dfile.encoding=UTF-8
org.gradle.daemon=true
org.gradle.parallel=false
org.gradle.workers.max=1
org.gradle.caching=true
# Run Kotlin compilation inside the Gradle daemon instead of spawning a second JVM.
kotlin.compiler.execution.strategy=in-process
kotlin.incremental=true
android.useAndroidX=true
# Jetifier rewrites legacy Support Library artifacts. Every dependency here is
# already AndroidX, and the transform OOMs on the Flutter engine jar, so keep it off.
android.enableJetifier=false
